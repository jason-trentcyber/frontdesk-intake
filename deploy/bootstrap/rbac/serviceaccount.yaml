# CI's identity for `helm upgrade --install` (ADR-0014). Not the pod's own
# ServiceAccount (deploy/chart/templates/serviceaccount.yaml) - this one
# never runs inside a Pod; its token becomes the Actions secret
# KUBECONFIG_B64.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: frontdesk
automountServiceAccountToken: false
