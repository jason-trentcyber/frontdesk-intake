# Exactly what `helm upgrade --install deploy/chart -n frontdesk --wait`
# needs, and nothing else (ADR-0014: no cluster-admin, no cross-namespace).
# Namespaced to `frontdesk` - this Role grants nothing outside it.
# ADR-0015 documents this Role's full verb-by-verb surface; ADR-0016 added
# the statefulsets/persistentvolumeclaims/cronjobs/jobs rules below for
# Postgres (#20); ADR-0020 added `patch` to jobs for Helm 4's server-side
# apply of hooks. This surface is a function of the Helm major version -
# deploy.yml pins it for that reason.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: frontdesk
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    # Read-only: `--wait` checks Deployment rollout status via its
    # ReplicaSet, not just the Deployment object itself.
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    # Covers both app secrets (e.g. sealed-secrets' decrypted output) and
    # Helm's own release-state storage (Secrets of type helm.sh/release.v1).
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    # Read-only: `--wait` polls Pod readiness; Helm never creates Pods
    # directly (the Deployment controller does).
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    # The Postgres StatefulSet (#20, ADR-0016).
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    # Postgres's data and backups PVCs. No `delete`: CI can create the
    # volumes and adjust labels; only a human with the admin kubeconfig
    # deletes a PVC (ADR-0016 RBAC).
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    # The nightly backup schedule is chart-managed (ADR-0016).
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    # `patch` is what "create" costs under Helm 4 (ADR-0020, superseding
    # ADR-0016's "no patch" clause): Helm 4 applies hook resources with
    # server-side apply, which the API server authorizes as `patch` even
    # when the object does not exist yet - so a create-only grant cannot
    # install the frontdesk-db-migrate hook at all. Still no `update`:
    # SSA needs only `patch`, and full-object `update` is the verb that
    # would let CI rewrite a Job it did not render.
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
