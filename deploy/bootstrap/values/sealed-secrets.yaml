# sealed-secrets/sealed-secrets, pinned in bootstrap.sh. Installed into
# kube-system with `--namespace kube-system` on the helm command, not here.
#
# docs/conventions.md names sealed-secrets for prod secrets. The Cloudflare
# API token cert-manager needs (see ../cluster-issuers/) is the first one:
# Jason fetches the controller's public cert with `kubeseal --fetch-cert`,
# seals the token locally, and commits the sealed file — the plaintext
# never touches the repo or an agent (see README.md).
resources:
  requests:
    cpu: 10m
    memory: 30Mi
  limits:
    cpu: 50m
    memory: 128Mi
