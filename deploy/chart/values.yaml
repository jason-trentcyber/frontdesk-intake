# k3s-agnostic defaults (ADR-0001). Nothing here references k3s, Hetzner,
# or Cloudflare by name (docs/conventions.md -> Infra); platform-specific
# overrides live in values-hetzner.yaml and values-eks.yaml.
#
# #18 ships only the `web` component (the hello page). api/worker land
# with #22/#23 as their own Deployments in this same chart.

web:
  replicaCount: 1

  image:
    repository: ghcr.io/jason-trentcyber/frontdesk-web
    # Pinned by digest at deploy time (ADR-0014): --set web.image.digest=sha256:...
    # `tag` is a fallback only so this chart lints/templates without it.
    digest: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: false

  podSecurityContext:
    runAsNonRoot: true
    # Pinned to match the image's numeric USER (web/Dockerfile) so the
    # chart enforces the non-root UID/GID regardless of what the image
    # does - runAsNonRoot alone can't verify a named image USER statically
    # and fails the pod with CreateContainerConfigError (#18 postmortem).
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  networkPolicy:
    enabled: true
    # Allow ingress only from the ingress-nginx namespace (#16); default
    # deny otherwise.
    fromNamespace: ingress-nginx

# api/ is the external integration surface and the sole Queue producer
# (ADR-0004, ADR-0021) - F3's API-key intake, F15's index-info, its own
# /healthz + /readyz. Not a REST facade for web/, which reads and writes
# through @frontdesk/db in-process instead.
api:
  replicaCount: 1

  image:
    repository: ghcr.io/jason-trentcyber/frontdesk-api
    # Pinned by digest at deploy time (ADR-0014): --set api.image.digest=sha256:...
    # `tag` is a fallback only so this chart lints/templates without it.
    digest: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: false

  podSecurityContext:
    runAsNonRoot: true
    # Matches api/Dockerfile's numeric USER 1001:1001 - same reasoning as
    # web.podSecurityContext above (#18/#65 postmortem).
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 80
    targetPort: 3001

  networkPolicy:
    enabled: true
    # Same reasoning as web's: /api/ is routed through the shared Ingress
    # (templates/ingress.yaml), so only ingress-nginx needs to reach this
    # pod directly.
    fromNamespace: ingress-nginx

  # Selection is env-only (ADR-0004) - no auto-detection. sqs needs
  # AWS_REGION/SQS_QUEUE_URL/SQS_DLQ_URL too; none of that is wired here
  # because pgmq is the deployed provider (ADR-0004). A platform whose
  # values file sets sqs supplies those three there, not in this file.
  queueProvider: pgmq

# Postgres 16 + pgvector + pgmq, as a StatefulSet in this same chart/release
# (ADR-0016). postgres.enabled: false on EKS (values-eks.yaml) - the swap
# is an externally supplied database.externalSecretName (RDS), same
# values-file discipline as every other platform difference.
postgres:
  enabled: true

  image:
    repository: ghcr.io/jason-trentcyber/frontdesk-postgres
    # Version tag = content (ADR-0016); bumped only in a deploy/postgres/
    # image-bump PR, never rewritten by deploy.yml. `tag` is a fallback
    # only so this chart lints/templates without a digest, same pattern
    # as web.image above.
    tag: "16.15-pgvector0.8.6-pgmq1.13.0"
    digest: "sha256:6b99f66e5de740b1e5cff5726a85e8d06e63d4100bcbdacd74378b22bdb19f83"
    pullPolicy: IfNotPresent

  storage:
    size: 10Gi

  backups:
    enabled: true
    schedule: "15 3 * * *"
    size: 5Gi
    retentionDays: 14

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # The five tuning knobs ADR-0016 sizes for the node's memory budget.
  # Rendered into postgres-configmap.yaml; postgres-statefulset.yaml passes
  # it as the *entire* config_file (not an include on top of the image's
  # own defaults - see that template's header comment for why that matters).
  config:
    shared_buffers: "192MB"
    effective_cache_size: "512MB"
    work_mem: "8MB"
    maintenance_work_mem: "64MB"
    max_connections: "60"

  # Keys: postgres-password, frontdesk-password, frontdesk-app-password
  # (sealed/postgres-credentials.sealed.yaml, sealed/README.md). Sealed by
  # Jason for namespace frontdesk; this chart only ever references it by
  # name via secretKeyRef, never reads or creates it.
  credentialsSecret: postgres-credentials

  podSecurityContext:
    # 999 is the pgvector/pgvector base image's `postgres` system user -
    # confirmed in deploy/postgres/Dockerfile's header comment (#20 PR A).
    # Named USER values fail runAsNonRoot the same way web/Dockerfile's did
    # (#18/#65); this image has no Dockerfile-level USER to make numeric in
    # the first place, so the chart pins the uid/gid it already runs as.
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    # Exception to web's readOnlyRootFilesystem: true (ADR-0016): Postgres
    # writes temp files and lock files outside the paths this chart gives
    # a dedicated volume (data, the config mount, /var/run/postgresql).
    # Covering every write path individually cost more than it's worth for
    # a single-instance database pod; the ADR accepts this exception rather
    # than fighting it further.
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  service:
    port: 5432

# The migrate Job (ADR-0018, ADR-0019): a post-install,pre-upgrade Helm
# hook that runs @frontdesk/db's migrations then seed against the
# postgres StatefulSet above. Digest pinned by deploy.yml alongside
# web.image; `tag` is the same lint/template-only fallback web.image uses.
db:
  image:
    repository: ghcr.io/jason-trentcyber/frontdesk-db
    digest: ""
    tag: "latest"
    pullPolicy: IfNotPresent

  migrate:
    # values-eks.yaml turns this off: postgres.enabled: false there means
    # frontdesk-postgres-connection never renders, so the Job would have
    # no host to read (see that file's comment).
    enabled: true

  seed:
    # A real address never enters the repo (ADR-0018 Seeds) - db/seed.ts
    # derives both orgs' owner emails from this one via plus-addressing.
    ownerEmail: "owner@example.com"

ingress:
  enabled: true
  className: nginx
  host: frontdesk.jtrent.dev
  clusterIssuer: letsencrypt-prod
  tlsSecretName: frontdesk-tls

# Public: safe in a ConfigMap. #27 (public form) is the first real
# consumer; the ConfigMap ships now so the chart's env wiring is complete.
turnstile:
  siteKey: "0x4AAAAAAEtBmgvARsd60xeS"
  # Secret is NOT created by this chart - sealed by Jason for namespace
  # frontdesk, shipped as deploy/chart/sealed/turnstile.sealed.yaml, and
  # applied via templates/sealed-secrets.yaml (see sealed/README.md).
  secretName: turnstile
  secretKey: secret-key
