# Documented EKS delta for *this application chart* (ADR-0001, ADR-0002).
# Never applied in v1 - infra/aws/ is validate-only.
#
# This is distinct from the top-level ../values-eks.yaml, which is the
# #16/#17 *bootstrap layer*'s EKS delta (the ingress-nginx controller's
# own Service type -> LoadBalancer/NLB). ADR-0002 already decided EKS runs
# the identical ingress-nginx controller "behind an NLB" - so this chart's
# own Ingress resource needs no annotation or ingressClassName swap at all:
# TLS still terminates at ingress-nginx via cert-manager, the rate-limit
# annotation is still an ingress-nginx feature, and Cloudflare is still the
# DNS-01 provider regardless of which cluster is running. Nothing to
# override here for `web` yet.

# Postgres swap (ADR-0016 Consequences): no in-cluster StatefulSet on EKS,
# an externally managed RDS for PostgreSQL 16 instead - same
# `postgres.enabled` discipline every other platform difference in this
# chart already uses. Both extensions this app needs are supported on RDS:
# pgvector natively, pgmq via its SQL-only install path (`rds.extensions`
# parameter group; RDS doesn't ship the pgmq extension binary/files, but
# there's nothing to ship - see deploy/postgres/Dockerfile's header, pgmq
# has been pure SQL since 1.0, so its .sql files install the same way).
postgres:
  enabled: false

# postgres.enabled: false above means frontdesk-postgres-connection (the
# ConfigMap db-migrate-job.yaml reads PGHOST/PGPORT/... from) never
# renders, so the migrate Job would have no host to connect to. Turning
# it off here is the same values-file discipline as postgres.enabled
# itself; re-enabling it on EKS is the same PR that wires
# database.externalSecretName below into the Job's env.
db:
  migrate:
    enabled: false

# Not yet consumed by any template - #20 PR B ships no RDS-consuming
# component. Documents the shape for whichever of #21 (Prisma)/#22
# (api)/#23 (worker) lands on EKS first: a human (or Terraform, outside
# this chart) creates a Secret with this name in the frontdesk namespace,
# holding RDS-shaped DATABASE_URL/DATABASE_APP_URL, and that PR wires its
# Deployment's env to reference it instead of the in-chart
# postgres-credentials-derived config (deploy/postgres/README.md).
database:
  externalSecretName: ""

# api/ (#22) needs no override here today. Its Deployment env still
# points at the in-chart postgres-credentials-derived DATABASE_URL above
# this file's postgres.enabled: false - fixing that is the same PR as
# database.externalSecretName's real consumer, not a blank api: block
# added preemptively. QUEUE_PROVIDER=sqs also needs AWS API access via
# IRSA rather than a static credential once it's real on EKS:
# api:
#   queueProvider: sqs
#   serviceAccount:
#     annotations:
#       eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<role-name>"
