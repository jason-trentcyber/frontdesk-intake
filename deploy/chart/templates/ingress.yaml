{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "frontdesk.web.fullname" . }}
  labels:
    {{- include "frontdesk.web.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Most specific prefix first for readability (ingress-nginx
          # sorts by specificity regardless of list order, but a reader
          # shouldn't have to know that). One Ingress, one host, two
          # backends by audience (ADR-0021) - not a second Ingress
          # resource.
          #
          # Auth.js's own endpoints live under /api/auth/* IN THE WEB
          # APP (web/src/app/api/auth/[...nextauth]/route.ts), not in
          # api/ - despite the /api prefix, which names api/'s surface
          # (F3, F15) and predates Auth.js entirely. Without this rule,
          # every /api/auth/* request matches the plain /api prefix
          # below and is routed to Fastify, which has no such route and
          # 404s - silently breaking sign-in through the public URL
          # while `kubectl exec`'ing into the web pod directly still
          # works, since that path never goes through this Ingress at
          # all (26a follow-up, #26).
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "frontdesk.web.fullname" . }}
                port:
                  number: {{ .Values.web.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "frontdesk.api.fullname" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "frontdesk.web.fullname" . }}
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
