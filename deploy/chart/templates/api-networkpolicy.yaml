{{- if .Values.api.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frontdesk.api.fullname" . }}
  labels:
    {{- include "frontdesk.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frontdesk.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.api.networkPolicy.fromNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.targetPort }}
{{- end }}
