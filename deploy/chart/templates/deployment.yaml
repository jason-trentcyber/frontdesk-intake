apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontdesk.web.fullname" . }}
  labels:
    {{- include "frontdesk.web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "frontdesk.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontdesk.web.selectorLabels" . | nindent 8 }}
        {{- include "frontdesk.partOf" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "frontdesk.web.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.web.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "frontdesk.web.image" . }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.web.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.web.service.targetPort | quote }}
            # ADR-0017's env pattern, exactly - copied verbatim from
            # api-deployment.yaml (ADR-0021, ADR-0027). web/ references
            # APP_PGUSER + frontdesk-app-password only; it must never
            # reference frontdesk-password, that key is
            # frontdesk-db-migrate's alone (ADR-0017, ADR-0019).
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "frontdesk.postgres.fullname" . }}-connection
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "frontdesk.postgres.fullname" . }}-connection
                  key: PGPORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "frontdesk.postgres.fullname" . }}-connection
                  key: PGDATABASE
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "frontdesk.postgres.fullname" . }}-connection
                  key: APP_PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: frontdesk-app-password
            - name: DATABASE_URL
              value: "postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)"
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "frontdesk.web.fullname" . }}
                  key: TURNSTILE_SITE_KEY
            # Mirror of api-deployment.yaml's PUBLIC_WEB_ORIGIN (derived
            # from ingress.host so it can't drift), for the opposite
            # direction: web's public-form Server Action calls api/'s
            # intake path pod-to-pod (ADR-0021 "one enqueue
            # implementation"), never by leaving the cluster through the
            # public Ingress and back in. Derived from the api Service's
            # own name/port, not hardcoded, for the same reason
            # PUBLIC_WEB_ORIGIN is derived rather than typed twice. No
            # default in code (web/src/lib/env.ts) - same reasoning
            # api/src/env.ts gives for PUBLIC_WEB_ORIGIN: a default
            # necessarily names one environment's address, so a
            # misconfigured one would silently call the wrong place
            # rather than fail loudly.
            - name: API_ORIGIN
              value: "http://{{ include "frontdesk.api.fullname" . }}:{{ .Values.api.service.port }}"
            # ADR-0031 (#26). Auth.js v5 auto-reads these four by name -
            # no explicit clientId/clientSecret in web/src/lib/auth.ts.
            # oauth and auth-secret were sealed by #6/PR #118; this is
            # their first consumer.
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: oauth
                  key: google-id
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth
                  key: google-secret
            - name: AUTH_GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: oauth
                  key: github-id
            - name: AUTH_GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth
                  key: github-secret
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: auth-secret
            # 26a follow-up (#26): self-hosted behind ingress-nginx, not
            # a platform Auth.js auto-detects (Vercel) - without this,
            # Auth.js derives its own origin from the request/bind
            # address (observed in production: "http://0.0.0.0:3000/..."
            # in signinUrl), which never matches the redirect_uri
            # registered in the Google Cloud Console (#6) and breaks
            # every OAuth callback. Set from ingress.host, the same knob
            # PUBLIC_WEB_ORIGIN/API_ORIGIN already derive from - never
            # hardcoded (ADR-0002 keeps deploy/chart/ portable, no
            # Cloudflare/Hetzner/k3s names here).
            #
            # No separate AUTH_TRUST_HOST: Auth.js's own setEnvDefaults
            # (@auth/core/lib/utils/env.js) computes
            # `config.trustHost ?? !!(AUTH_URL ?? AUTH_TRUST_HOST ?? ...)`
            # - AUTH_URL is checked first in that chain, so setting it
            # already implies trustHost = true. A separate
            # AUTH_TRUST_HOST=true next to it would do nothing but leave
            # a reader wondering which one is actually in effect.
            - name: AUTH_URL
              value: "https://{{ .Values.ingress.host }}"
          # Split same as api-deployment.yaml, now that web/ holds a DB
          # credential too (this PR): readiness checks the database
          # (web/src/app/readyz/route.ts, one SELECT 1) so a pod with a
          # mis-wired credential is pulled from rotation instead of
          # serving 500s to every tracking-page visitor; liveness stays on
          # /healthz (no DB dependency) because a DB outage is not
          # something restarting this pod would fix.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
