# Observability for the frontdesk cluster, running on the Hermes VPS
# (trentcyber-main) rather than the 4 GB k3s node - ADR-0010 put it here
# deliberately. ADR-0026 records why it started as Prometheus + Grafana only;
# ADR-0039 adds Loki once its triggers were met (memory measured, and the
# cluster's otel-collector given something to ship). Alertmanager is still
# deferred - it waits on an alert rule someone would act on (#32).
#
# Everything binds a specific address (ADR-0028 §2: the bind address is
# the control, a host firewall is not). These services use
# `network_mode: host`, so there is no `ports:` list to carry the
# "127.0.0.1:PORT:PORT" form ADR-0028 §1 describes - the bind address
# lives in each service's own config instead (--web.listen-address,
# GF_SERVER_HTTP_ADDR, http_listen_address). Same control, different
# file; Docker installs no DNAT rule either way. Prometheus and Grafana
# bind 127.0.0.1. Loki binds the VPS's tailnet address, because the
# node's collector has to reach it and that is the only interface the
# node can see - so it is reachable from exactly the network that needs
# it and no other. Grafana is reached over the tailnet or an SSH tunnel,
# same as the Hermes dashboard. No new public attack surface (ADR-0002's
# posture).
#
# Memory limits are set from measurement, not from vendor defaults - see
# ADR-0026's and ADR-0039's Context for the free-memory arithmetic.
services:
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15d at this scrape volume is well under a GB; the VPS has disk to
      # spare and it is long enough to see a week-over-week trend.
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 320M

  loki:
    # #29 stage 2a (ADR-0039). Receives pod logs from the cluster's
    # otel-collector over the tailnet on its native OTLP endpoint.
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
    network_mode: host
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          # Set from ADR-0039's measurement (2.8 GB available, Prometheus +
          # Grafana at ~170 MB combined), not from headroom. The ingester
          # holds chunks in memory before flushing; 512M is comfortable
          # for one node's logs. Revised after measuring steady state, the
          # same way ADR-0026 §6 set the other two.
          memory: 512M

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3300"
      # Anonymous viewer access: this Grafana is reachable only over the
      # tailnet/an SSH tunnel, so the tailnet ACL is the authentication
      # boundary. A second password to manage buys nothing here, and the
      # admin account below still gates edits.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      # Read from the environment (deploy/observability/.env, gitignored).
      # No default: compose fails loudly rather than starting with a
      # guessable password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/observability/.env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
