# Compose v2 spec, no top-level `version:` key. See docs/conventions.md → Toolchain.
services:
  postgres:
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    image: frontdesk/postgres-pgvector-pgmq:pg16
    restart: unless-stopped
    environment:
      # postgres is the superuser (ADR-0016); deploy/postgres/initdb/002-roles.sh
      # creates the frontdesk (owner) and frontdesk_app (runtime) roles the
      # app actually connects as.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-frontdesk}
      FRONTDESK_PASSWORD: ${FRONTDESK_PASSWORD:-frontdesk}
      FRONTDESK_APP_PASSWORD: ${FRONTDESK_APP_PASSWORD:-frontdesk_app}
    ports:
      # Loopback-only. A bare "5432:5432" binds 0.0.0.0, and Docker's
      # published ports are DNAT'd in nat/PREROUTING + the DOCKER chain,
      # which never traverse ufw's INPUT chain - so a host firewall rule
      # reports success and enforces nothing. On 2026-09-13 this port,
      # with .env.example's published default superuser password, was
      # found by a scanner and the local frontdesk database was dropped
      # and replaced with a ransom note. Every consumer of this port is
      # local (tests, migrate, seed, psql); nothing off-host needs it.
      - "127.0.0.1:5432:5432"
    volumes:
      # initdb/ is baked into the image (deploy/postgres/Dockerfile,
      # ADR-0016), not bind-mounted - only the data volume is local state.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-frontdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  localstack:
    # Pinned: `latest` (2026.x) requires a LOCALSTACK_AUTH_TOKEN and exits without one.
    # 4.14.0 is the last Community release that runs unauthenticated. SQS only (ADR-0004).
    image: localstack/localstack:4.14.0
    restart: unless-stopped
    environment:
      SERVICES: sqs
    ports:
      # Loopback-only, same reasoning as postgres above. LocalStack's
      # edge port serves an unauthenticated AWS-compatible API on 4566.
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  pgdata:
