name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version:` input: reads the pinned version from package.json's
        # `packageManager` field (pnpm@10.34.5).

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm --version
          pnpm lint

      - name: Typecheck
        run: |
          pnpm --version
          pnpm typecheck

      - name: Test
        run: |
          pnpm --version
          pnpm test

      # A broken Next build must fail CI, not surface for the first time
      # in deploy.yml after a merge (#18).
      - name: Build web
        run: |
          pnpm --version
          pnpm --filter @frontdesk/web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # No registry login, no push (deploy.yml does the real build+push
      # after merge). This only proves the Dockerfile still builds -
      # context is the repo root, same as deploy.yml (web/Dockerfile is a
      # pnpm-workspace build, see its header comment).
      - name: Build web image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: web/Dockerfile
          push: false

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv --version
          uv sync --frozen

      - name: Ruff check
        run: |
          uv run ruff --version
          uv run ruff check .

      - name: Ruff format check
        run: |
          uv run ruff --version
          uv run ruff format --check .

      - name: Pyright
        run: |
          uv run pyright --version
          uv run pyright

      - name: Pytest
        run: |
          uv run pytest --version
          uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action works without a license for personal-account
      # repos (this one), but its PR-comment feature needs `pull-requests: write`,
      # which would mean overriding this workflow's blanket `contents: read`.
      # Downloading the pinned, checksum-verified binary and running
      # `gitleaks detect` directly gets the same scan with no extra permissions.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: |
          gitleaks version
          gitleaks detect --source . --redact --verbose

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      # #18: deploy/chart is the real application chart. Lint + template +
      # validate both platform values files against the k3s cluster's own
      # Kubernetes version (infra/hetzner: k3s v1.36.4+k3s1).
      - name: Lint chart
        run: |
          helm version
          helm lint deploy/chart -f deploy/chart/values-hetzner.yaml
          helm lint deploy/chart -f deploy/chart/values-eks.yaml

      - name: Template + validate chart
        run: |
          set -euo pipefail
          for values in values-hetzner values-eks; do
            echo "== $values =="
            helm template frontdesk deploy/chart -n frontdesk \
              -f "deploy/chart/$values.yaml" \
              > "/tmp/rendered-$values.yaml"
            kubeconform -kubernetes-version 1.36.0 -summary -strict "/tmp/rendered-$values.yaml"
          done

      # #16: lint/template deploy/bootstrap/values/*.yaml against their
      # pinned charts. No cluster access, independent of deploy/chart/.
      # Chart/version pins here must stay in sync with deploy/bootstrap/bootstrap.sh.
      - name: Add bootstrap chart repos
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Lint + template bootstrap values
        run: |
          set -euo pipefail
          declare -A CHARTS=(
            [ingress-nginx]="ingress-nginx/ingress-nginx 4.15.1"
            [cert-manager]="jetstack/cert-manager v1.21.1"
            [sealed-secrets]="sealed-secrets/sealed-secrets 2.19.3"
            [otel-collector]="open-telemetry/opentelemetry-collector 0.172.1"
            [node-exporter]="prometheus-community/prometheus-node-exporter 4.56.3"
            [kube-state-metrics]="prometheus-community/kube-state-metrics 8.4.2"
          )
          for f in deploy/bootstrap/values/*.yaml; do
            name="$(basename "$f" .yaml)"
            spec="${CHARTS[$name]:-}"
            if [ -z "$spec" ]; then
              echo "No pinned chart for $f in this workflow; add one." >&2
              exit 1
            fi
            chart="${spec% *}"
            version="${spec#* }"
            echo "== $name ($chart @ $version) =="
            rm -rf "/tmp/chart-$name"
            helm pull "$chart" --version "$version" --untar --untardir "/tmp/chart-$name"
            helm lint "/tmp/chart-$name"/* -f "$f"
            helm template "$name" "$chart" --version "$version" -f "$f" > /dev/null
          done

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/hetzner, infra/aws, infra/cloudflare]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Terraform root
        id: tf
        run: |
          if ls ${{ matrix.dir }}/*.tf >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No *.tf files in ${{ matrix.dir }} yet (see #15/#19); skipping terraform validate."
          fi

      - name: Set up Terraform
        if: steps.tf.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Format check
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          terraform version
          terraform fmt -check -recursive

      - name: Init
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false

      - name: Validate
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform validate
