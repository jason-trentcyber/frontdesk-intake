name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version:` input: reads the pinned version from package.json's
        # `packageManager` field (pnpm@10.34.5).

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm --version
          pnpm lint

      - name: Typecheck
        run: |
          pnpm --version
          pnpm typecheck

      - name: Test
        run: |
          pnpm --version
          pnpm test

      # A broken Next build must fail CI, not surface for the first time
      # in deploy.yml after a merge (#18).
      - name: Build web
        run: |
          pnpm --version
          pnpm --filter @frontdesk/web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # No registry login, no push (deploy.yml does the real build+push
      # after merge). This only proves the Dockerfiles still build -
      # context is the repo root for all three, same as deploy.yml (each
      # is a pnpm-workspace build, see their header comments). Every
      # image deploy.yml builds is covered here: without a step per
      # image, a broken Dockerfile would pass CI and fail on main at
      # deploy time (the db one was forgotten in #80's brief - do not
      # repeat that here for api/).
      - name: Build web image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: web/Dockerfile
          push: false

      - name: Build db image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: db/Dockerfile
          push: false

      - name: Build api image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          push: false

      - name: Build worker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: worker/Dockerfile
          push: false

  db:
    runs-on: ubuntu-latest
    # Chart-pinned image (deploy/chart/values.yaml postgres.image.digest,
    # ADR-0016) so roles and extensions in CI match production exactly.
    # Public on GHCR (verified anonymous pull, #20) - no login needed.
    services:
      postgres:
        image: ghcr.io/jason-trentcyber/frontdesk-postgres@sha256:6b99f66e5de740b1e5cff5726a85e8d06e63d4100bcbdacd74378b22bdb19f83
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frontdesk
          # Throwaway CI values, plain strings - not secrets.
          FRONTDESK_PASSWORD: frontdesk
          FRONTDESK_APP_PASSWORD: frontdesk_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frontdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://frontdesk:frontdesk@localhost:5432/frontdesk
      DATABASE_APP_URL: postgresql://frontdesk_app:frontdesk_app@localhost:5432/frontdesk
      MIGRATE_DATABASE_URL: postgresql://frontdesk:frontdesk@localhost:5432/frontdesk
      SEED_OWNER_EMAIL: owner@example.com
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm --filter @frontdesk/db migrate

      - name: Seed
        run: pnpm seed

      # ADR-0018 acceptance 4: running seed twice must produce identical
      # row counts (idempotent by natural key).
      - name: Seed again (idempotency)
        run: pnpm seed

      - name: Test
        run: pnpm --filter @frontdesk/db test

      # Drift gate: fails if the committed migrations don't match the
      # schema in db/src/schema/.
      - name: Check for schema drift
        run: pnpm --filter @frontdesk/db check

  # api/'s tests need real backing services, so they run here rather than
  # in `node` (which has none and would silently skip them). ADR-0004 is
  # explicit: "CI runs the same contract tests against pgmq (Postgres
  # service container) and SQS (LocalStack service container)" - both are
  # below, and a green `node` job is not evidence either adapter works.
  # Same Postgres image and migrate/seed steps as `db` above: the intake
  # tests resolve real seeded orgs.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/jason-trentcyber/frontdesk-postgres@sha256:6b99f66e5de740b1e5cff5726a85e8d06e63d4100bcbdacd74378b22bdb19f83
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frontdesk
          # Throwaway CI values, plain strings - not secrets.
          FRONTDESK_PASSWORD: frontdesk
          FRONTDESK_APP_PASSWORD: frontdesk_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frontdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Pinned 4.14.0, not latest: 2026.x requires a LOCALSTACK_AUTH_TOKEN
      # and exits without one (same pin and reason as compose.yaml).
      # SQS only - ADR-0004 rejects LocalStack as anything but a test
      # double for the second adapter.
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://frontdesk:frontdesk@localhost:5432/frontdesk
      DATABASE_APP_URL: postgresql://frontdesk_app:frontdesk_app@localhost:5432/frontdesk
      MIGRATE_DATABASE_URL: postgresql://frontdesk:frontdesk@localhost:5432/frontdesk
      SEED_OWNER_EMAIL: owner@example.com
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm --filter @frontdesk/db migrate

      - name: Seed
        run: pnpm seed

      # A skipped test is not a passing test. Every api/ test file gates
      # itself on env (DATABASE_APP_URL, AWS_ENDPOINT_URL) so it can run
      # on a laptop without services; that same guard would let the whole
      # suite silently skip here if a service container or env var went
      # missing, and the job would still be green. One run, JSON reporter,
      # then assert the skip count - the suite is not run twice.
      - name: Test (and assert nothing skipped)
        run: |
          pnpm --filter @frontdesk/api test --reporter=default --reporter=json --outputFile=/tmp/api-tests.json
          skipped=$(node -e "const r=require('/tmp/api-tests.json');console.log(r.numPendingTests+r.numTodoTests)")
          echo "skipped=$skipped"
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped api/ test(s) skipped - a service container or env var is missing" >&2
            exit 1
          fi

  # worker/'s Postgres-backed tests (for_org(), the pgmq adapter, spend.py -
  # docs/adr/0023-worker-runtime-shape.md §1 calls the for_org() tests "the
  # point of" db.py) need the same service container as the db/ and api/
  # jobs above; the sqs adapter tests need the same LocalStack container as
  # api's job, for the same reason api's job has both - one adapter each.
  # worker/'s Postgres tests create their own org/request/draft rows (not
  # the seed data), so this job runs migrations but not `pnpm seed`.
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/jason-trentcyber/frontdesk-postgres@sha256:6b99f66e5de740b1e5cff5726a85e8d06e63d4100bcbdacd74378b22bdb19f83
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frontdesk
          # Throwaway CI values, plain strings - not secrets.
          FRONTDESK_PASSWORD: frontdesk
          FRONTDESK_APP_PASSWORD: frontdesk_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frontdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://frontdesk:frontdesk@localhost:5432/frontdesk
      DATABASE_APP_URL: postgresql://frontdesk_app:frontdesk_app@localhost:5432/frontdesk
      MIGRATE_DATABASE_URL: postgresql://frontdesk:frontdesk@localhost:5432/frontdesk
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      # worker/'s tests read the schema this creates (orgs, requests,
      # drafts); they insert their own rows rather than depending on
      # `pnpm seed`'s fixtures, so seeding isn't needed here.
      - name: Migrate
        run: pnpm --filter @frontdesk/db migrate

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: worker
        run: |
          uv --version
          uv sync --frozen

      - name: Ruff check
        working-directory: worker
        run: |
          uv run ruff --version
          uv run ruff check .

      - name: Ruff format check
        working-directory: worker
        run: |
          uv run ruff --version
          uv run ruff format --check .

      - name: Pyright
        working-directory: worker
        run: |
          uv run pyright --version
          uv run pyright

      # Same reasoning as api's "Test (and assert nothing skipped)" step:
      # worker/'s tests gate themselves on DATABASE_APP_URL/AWS_ENDPOINT_URL
      # so they can run on a laptop without services, and that same guard
      # would let the whole suite silently skip here if a service container
      # or env var went missing. pytest's built-in JUnit XML reporter
      # (no extra plugin) carries the skip count.
      - name: Pytest (and assert nothing skipped)
        working-directory: worker
        run: |
          uv run pytest --version
          uv run pytest --junit-xml=/tmp/worker-tests.xml
          skipped=$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/worker-tests.xml').getroot()
          print(sum(int(s.get('skipped', 0)) for s in root.iter('testsuite')))
          ")
          echo "skipped=$skipped"
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped worker/ test(s) skipped - a service container or env var is missing" >&2
            exit 1
          fi

  # ADR-0006's switch-proof, named as its own check (not just folded into
  # `python` above, even though that job's full suite already covers this
  # file too) so a reviewer sees "provider-parity" pass or fail directly in
  # the PR's checks list. Deliberately has no service containers: the
  # normalized-Completion comparison is fixture-only (respx, botocore
  # Stubber) - no network, no API key, per ADR-0006's switch-proof.
  provider-parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv --version
          uv sync --frozen

      - name: Provider parity
        run: |
          uv run pytest --version
          uv run pytest tests/test_provider_parity.py -v

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action works without a license for personal-account
      # repos (this one), but its PR-comment feature needs `pull-requests: write`,
      # which would mean overriding this workflow's blanket `contents: read`.
      # Downloading the pinned, checksum-verified binary and running
      # `gitleaks detect` directly gets the same scan with no extra permissions.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: |
          gitleaks version
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      # #18: deploy/chart is the real application chart. Lint + template +
      # validate both platform values files against the k3s cluster's own
      # Kubernetes version (infra/hetzner: k3s v1.36.4+k3s1).
      - name: Lint chart
        run: |
          helm version
          helm lint deploy/chart -f deploy/chart/values-hetzner.yaml
          helm lint deploy/chart -f deploy/chart/values-eks.yaml

      - name: Template + validate chart
        run: |
          set -euo pipefail
          for values in values-hetzner values-eks; do
            echo "== $values =="
            helm template frontdesk deploy/chart -n frontdesk \
              -f "deploy/chart/$values.yaml" \
              > "/tmp/rendered-$values.yaml"
            # -skip SealedSecret: kubeconform has no schema for this CRD
            # (bitnami.com/v1alpha1, sealed-secrets) - not a real validation
            # gap, just a kind it can't look up. #20 is the first PR to
            # actually commit a sealed/*.yaml file, which is what surfaces
            # this; verified locally that -strict alone fails on it and
            # this flag is what fixes it.
            kubeconform -kubernetes-version 1.36.0 -summary -strict -skip SealedSecret "/tmp/rendered-$values.yaml"
            # kubeconform validates each document on its own, so a pod
            # template naming a ServiceAccount that no template emits passes
            # it and fails at deploy time instead (#99's worker). See the
            # script header for why lint/template/kubeconform all miss it.
            ./deploy/chart/check-manifest-refs.sh "/tmp/rendered-$values.yaml"
          done

      # #16: lint/template deploy/bootstrap/values/*.yaml against their
      # pinned charts. No cluster access, independent of deploy/chart/.
      # Chart/version pins here must stay in sync with deploy/bootstrap/bootstrap.sh.
      - name: Add bootstrap chart repos
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Lint + template bootstrap values
        run: |
          set -euo pipefail
          declare -A CHARTS=(
            [ingress-nginx]="ingress-nginx/ingress-nginx 4.15.1"
            [cert-manager]="jetstack/cert-manager v1.21.1"
            [sealed-secrets]="sealed-secrets/sealed-secrets 2.19.3"
            [otel-collector]="open-telemetry/opentelemetry-collector 0.172.1"
            [node-exporter]="prometheus-community/prometheus-node-exporter 4.56.3"
            [kube-state-metrics]="prometheus-community/kube-state-metrics 8.4.2"
          )
          for f in deploy/bootstrap/values/*.yaml; do
            name="$(basename "$f" .yaml)"
            spec="${CHARTS[$name]:-}"
            if [ -z "$spec" ]; then
              echo "No pinned chart for $f in this workflow; add one." >&2
              exit 1
            fi
            chart="${spec% *}"
            version="${spec#* }"
            echo "== $name ($chart @ $version) =="
            rm -rf "/tmp/chart-$name"
            helm pull "$chart" --version "$version" --untar --untardir "/tmp/chart-$name"
            helm lint "/tmp/chart-$name"/* -f "$f"
            helm template "$name" "$chart" --version "$version" -f "$f" > /dev/null
          done

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/hetzner, infra/aws, infra/cloudflare]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Terraform root
        id: tf
        run: |
          if ls ${{ matrix.dir }}/*.tf >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No *.tf files in ${{ matrix.dir }} yet (see #15/#19); skipping terraform validate."
          fi

      - name: Set up Terraform
        if: steps.tf.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Format check
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          terraform version
          terraform fmt -check -recursive

      - name: Init
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false

      - name: Validate
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform validate
