name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No `version:` input: reads the pinned version from package.json's
        # `packageManager` field (pnpm@10.34.5).

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm --version
          pnpm lint

      - name: Typecheck
        run: |
          pnpm --version
          pnpm typecheck

      - name: Test
        run: |
          pnpm --version
          pnpm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv --version
          uv sync --frozen

      - name: Ruff check
        run: |
          uv run ruff --version
          uv run ruff check .

      - name: Ruff format check
        run: |
          uv run ruff --version
          uv run ruff format --check .

      - name: Pyright
        run: |
          uv run pyright --version
          uv run pyright

      - name: Pytest
        run: |
          uv run pytest --version
          uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action works without a license for personal-account
      # repos (this one), but its PR-comment feature needs `pull-requests: write`,
      # which would mean overriding this workflow's blanket `contents: read`.
      # Downloading the pinned, checksum-verified binary and running
      # `gitleaks detect` directly gets the same scan with no extra permissions.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: |
          gitleaks version
          gitleaks detect --source . --redact --verbose

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check chart exists
        id: chart
        run: |
          if [ -f deploy/chart/Chart.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "deploy/chart/Chart.yaml not found yet (see #18); skipping helm lint."
          fi

      - name: Set up Helm
        if: steps.chart.outputs.exists == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        if: steps.chart.outputs.exists == 'true'
        run: |
          helm version
          helm lint deploy/chart

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/hetzner, infra/aws]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Terraform root
        id: tf
        run: |
          if ls ${{ matrix.dir }}/*.tf >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No *.tf files in ${{ matrix.dir }} yet (see #15/#19); skipping terraform validate."
          fi

      - name: Set up Terraform
        if: steps.tf.outputs.exists == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Format check
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          terraform version
          terraform fmt -check -recursive

      - name: Init
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false

      - name: Validate
        if: steps.tf.outputs.exists == 'true'
        working-directory: ${{ matrix.dir }}
        run: terraform validate
