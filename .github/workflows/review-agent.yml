name: review-agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Decide whether this PR needs review
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Drafts skip review. A `docs` label must NOT bypass the agent:
            // the label is author-controlled, and secrets/ADR-edit checks apply to
            // docs changes too. (Its own first review flagged this. #41)
            //
            // Dependabot skips too: its runs read the *Dependabot* secret store, not
            // Actions secrets, so ANTHROPIC_API_KEY resolves empty and the CLI exits 1
            // on every dependency PR (#44-#49). Rationale and rejected alternatives in
            // ADR-0011. The ci jobs still run on those PRs and are what gates the merge.
            const pr = context.payload.pull_request;
            const isDependabot = pr.user.login === 'dependabot[bot]';
            const shouldRun = !pr.draft && !isDependabot;
            core.setOutput('should_run', shouldRun.toString());

  review:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.263

      - name: Build capped diff and changed-files list
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          MAX_BYTES=150000
          BASE="origin/${BASE_REF}"

          git diff "${BASE}...HEAD" > full.diff
          git diff --name-only "${BASE}...HEAD" > changed_files.txt

          SIZE=$(wc -c < full.diff)
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" full.diff | head -n -1 > diff.txt
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          else
            cp full.diff diff.txt
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build review prompt
        env:
          BASE_REF: ${{ github.base_ref }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
        run: |
          {
            echo "Review this pull request diff against your system prompt rubric."
            echo
            echo "Changed files:"
            cat changed_files.txt
            echo
            if [ "${TRUNCATED}" = "true" ]; then
              echo "NOTE: the diff below was truncated at ~150 KB. Add the required truncation finding."
              echo
            fi
            echo "Diff against ${BASE_REF}:"
            echo '```diff'
            cat diff.txt
            echo '```'
          } > prompt.txt

      - name: Write output JSON schema
        run: |
          cat > schema.json <<'EOF'
          {
            "type": "object",
            "properties": {
              "summary": { "type": "string" },
              "findings": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "severity": { "type": "string", "enum": ["blocking", "suggestion"] },
                    "rubric_item": { "type": "integer", "minimum": 1, "maximum": 7 },
                    "file": { "type": "string" },
                    "line": { "type": ["integer", "null"] },
                    "message": { "type": "string" },
                    "fix": { "type": "string" }
                  },
                  "required": ["severity", "rubric_item", "file", "line", "message", "fix"],
                  "additionalProperties": false
                }
              }
            },
            "required": ["summary", "findings"],
            "additionalProperties": false
          }
          EOF

      - name: Run Claude Code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          cat prompt.txt | claude -p \
            --bare \
            --append-system-prompt-file docs/review-rubric.md \
            --output-format json \
            --json-schema "$(cat schema.json)" \
            --model sonnet \
            --max-turns 6 \
            --max-budget-usd 1.00 \
            --allowedTools Read,Grep,Glob \
            > review.json

      - name: Post review and enforce blocking findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            // Verified against claude 2.1.236 locally and 2.1.263 in CI (run on #41): with --json-schema the conforming object is
            // under `structured_output`; `result` holds the same JSON as a string.
            if (raw.is_error || raw.subtype !== 'success') {
              core.setFailed(`Review agent did not complete: subtype=${raw.subtype} error=${raw.api_error_status || raw.result || 'unknown'}`);
              return;
            }
            let parsed = raw.structured_output;
            if (!parsed && typeof raw.result === 'string') {
              try { parsed = JSON.parse(raw.result); } catch (e) { parsed = null; }
            }
            if (!parsed || !Array.isArray(parsed.findings)) {
              core.setFailed('Review agent output did not match the schema (no findings array).');
              return;
            }
            core.info(`Review cost: $${raw.total_cost_usd ?? '?'} over ${raw.num_turns ?? '?'} turns`);

            const summary = parsed.summary || '(no summary provided)';
            const findings = Array.isArray(parsed.findings) ? parsed.findings : [];
            const blocking = findings.filter((f) => f.severity === 'blocking');
            const suggestions = findings.filter((f) => f.severity !== 'blocking');

            const renderGroup = (title, items) => {
              if (items.length === 0) return '';
              const lines = items.map((f) => {
                const loc = f.line ? `${f.file}:${f.line}` : f.file;
                return `- **[rubric ${f.rubric_item}]** \`${loc}\` — ${f.message}\n  Fix: ${f.fix}`;
              });
              return `\n\n### ${title}\n\n${lines.join('\n')}`;
            };

            const body =
              `**Review summary:** ${summary}` +
              renderGroup('Blocking', blocking) +
              renderGroup('Suggestions', suggestions);

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: blocking.length > 0 ? 'REQUEST_CHANGES' : 'COMMENT',
              body,
            });

            if (blocking.length > 0) {
              core.setFailed(`review-agent found ${blocking.length} blocking finding(s)`);
            }
