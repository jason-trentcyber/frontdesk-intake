version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/" # pnpm workspace root (pnpm-workspace.yaml); covers web/ and api/ too
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # "uv", not "pip": worker/ is uv-managed (uv.lock) and Dependabot treats uv
  # as its own ecosystem, distinct from and more accurate than "pip" here.
  - package-ecosystem: "uv"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Tracks the pgvector/pgvector and ghcr.io/pgmq/pg16-pgmq base images via
  # deploy/postgres/Dockerfile's PGVECTOR_VERSION/PGMQ_VERSION ARGs
  # (ADR-0016). Base-image bumps still go through postgres-image.yml like
  # any other change to deploy/postgres/ - Dependabot only opens the PR.
  - package-ecosystem: "docker"
    directory: "/deploy/postgres"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
